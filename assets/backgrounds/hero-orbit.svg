<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hoGlow" cx="82%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoLimb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hoRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#hoGlow)"/>

  <!-- planet arc, right -->
  <g>
    <circle cx="1010" cy="392" r="212" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="1010" cy="392" r="212" fill="none" stroke="url(#hoLimb)" stroke-width="2"/>
    <circle cx="1010" cy="392" r="240" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
  </g>

  <!-- orbits -->
  <g fill="none" stroke="url(#hoRing)" stroke-width="1.5">
    <ellipse cx="1010" cy="392" rx="380" ry="150" transform="rotate(-24 1010 392)"/>
    <ellipse cx="1010" cy="392" rx="520" ry="215" transform="rotate(-14 1010 392)"/>
    <ellipse cx="1010" cy="392" rx="680" ry="292" transform="rotate(-30 1010 392)"/>
  </g>

  <!-- satellites -->
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="663" cy="292" r="3.2"/>
    <circle cx="520" cy="196" r="2.6"/>
    <circle cx="866" cy="120" r="3"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M655 292h-14M671 292h14M663 284v-12M663 300v12"/>
    <path d="M858 120h-11M874 120h11"/>
  </g>

  <!-- stars -->
  <g fill="#ffffff" fill-opacity="0.30">
    <circle cx="90" cy="60" r="1.4"/><circle cx="220" cy="140" r="1.1"/>
    <circle cx="350" cy="52" r="1.3"/><circle cx="140" cy="240" r="1.2"/>
    <circle cx="470" cy="112" r="1.1"/><circle cx="300" cy="268" r="1.2"/>
    <circle cx="60" cy="180" r="1"/><circle cx="560" cy="40" r="1.2"/>
  </g>
</svg>
