<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowA" cx="78%" cy="6%" r="65%">
      <stop offset="0%" stop-color="#2a6fa8" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#1b4a72" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e1620" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="8%" cy="90%" r="58%">
      <stop offset="0%" stop-color="#0f5f7a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0e1620" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limbD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fa3e3" stop-opacity="0"/>
      <stop offset="32%" stop-color="#6fc4f5" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#7ce0e8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4fa3e3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="atmoD" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2d86c4" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2d86c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fa3e3" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7cc0f0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4fa3e3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>

  <!-- star field -->
  <g fill="#dbeaf7">
    <g fill-opacity="0.55">
      <circle cx="140" cy="90" r="1.5"/><circle cx="330" cy="180" r="1.2"/>
      <circle cx="520" cy="70" r="1.6"/><circle cx="760" cy="150" r="1.1"/>
      <circle cx="980" cy="60" r="1.4"/><circle cx="1190" cy="140" r="1.2"/>
      <circle cx="1400" cy="80" r="1.6"/><circle cx="1540" cy="230" r="1.2"/>
      <circle cx="90" cy="300" r="1.3"/><circle cx="260" cy="420" r="1.1"/>
      <circle cx="640" cy="330" r="1.4"/><circle cx="880" cy="430" r="1.1"/>
      <circle cx="1290" cy="380" r="1.3"/><circle cx="1470" cy="520" r="1.2"/>
      <circle cx="180" cy="620" r="1.2"/><circle cx="470" cy="700" r="1.4"/>
      <circle cx="1080" cy="660" r="1.2"/><circle cx="1360" cy="790" r="1.3"/>
    </g>
    <g fill-opacity="0.26">
      <circle cx="230" cy="150" r="1"/><circle cx="430" cy="330" r="1"/>
      <circle cx="700" cy="240" r="1"/><circle cx="900" cy="120" r="1"/>
      <circle cx="1120" cy="290" r="1"/><circle cx="1330" cy="220" r="1"/>
      <circle cx="60" cy="500" r="1"/><circle cx="580" cy="540" r="1"/>
      <circle cx="820" cy="620" r="1"/><circle cx="1210" cy="560" r="1"/>
      <circle cx="1520" cy="660" r="1"/><circle cx="340" cy="840" r="1"/>
      <circle cx="700" cy="900" r="1"/><circle cx="1010" cy="840" r="1"/>
    </g>
  </g>

  <!-- planetary limb with atmosphere -->
  <g>
    <path d="M -300 1180 A 1250 1250 0 0 1 2000 690" fill="none" stroke="url(#atmoD)" stroke-width="160"/>
    <path d="M -300 1180 A 1250 1250 0 0 1 2000 690" fill="none" stroke="url(#limbD)" stroke-width="2.6"/>
  </g>

  <!-- orbital tracks -->
  <g fill="none" stroke="url(#arcD)" stroke-width="1.7">
    <ellipse cx="1180" cy="330" rx="760" ry="300" transform="rotate(-18 1180 330)"/>
    <ellipse cx="1180" cy="330" rx="560" ry="205" transform="rotate(-18 1180 330)"/>
    <ellipse cx="1180" cy="330" rx="960" ry="410" transform="rotate(-18 1180 330)"/>
  </g>

  <!-- ground tracks -->
  <g fill="none" stroke="#7cc0f0" stroke-opacity="0.20" stroke-width="1.4" stroke-dasharray="7 9">
    <path d="M -60 760 C 320 640 620 470 1000 380 S 1520 250 1700 190"/>
    <path d="M -60 900 C 400 830 780 690 1120 540 S 1560 380 1700 340"/>
  </g>
  <g fill="#9fd6ff" fill-opacity="0.55">
    <circle cx="1000" cy="380" r="3"/><circle cx="1120" cy="540" r="2.6"/>
    <circle cx="620" cy="470" r="2.4"/>
  </g>
</svg>
